[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vasp-slurm-agent"
version = "0.1.1"
description = "Prepare, run and follow VASP calculations on your Slurm cluster"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{name = "cuiqirui99"}]
requires-python = ">=3.11"
dependencies = [
    "pymatgen>=2024.11.13,<2027",
    "numpy>=1.26,<3",
    "matplotlib>=3.8,<4",
    "streamlit>=1.43,<2",
    "seekpath>=2.1,<3",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1.2,<2", "streamlit>=1.65,<2"]

[project.urls]
Homepage = "https://github.com/cuiqirui99/vasp-slurm-agent"
Repository = "https://github.com/cuiqirui99/vasp-slurm-agent"
Documentation = "https://github.com/cuiqirui99/vasp-slurm-agent/blob/main/README.md"
Issues = "https://github.com/cuiqirui99/vasp-slurm-agent/issues"

[project.scripts]
vasp-agent = "vasp_slurm_agent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vasp_slurm_agent = ["examples/*.cif"]

[tool.pytest.ini_options]
testpaths = ["tests"]
