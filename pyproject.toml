[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dft-agent"
version = "0.3.1"
description = "Run VASP on Slurm."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{name = "Qirui Cui", email = "qiruic@kth.se"}]
requires-python = ">=3.11"
dependencies = [
    "pymatgen>=2024.11.13,<2027",
    "numpy>=1.26,<3",
    "matplotlib>=3.8,<4",
    "streamlit>=1.43,<2",
    "seekpath>=2.1,<3",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
agent = ["openai>=1.99,<3"]
dev = ["pytest>=8,<10", "build>=1.2,<2", "streamlit>=1.65,<2"]

[project.urls]
Homepage = "https://github.com/cuiqirui99/dft-agent"
Repository = "https://github.com/cuiqirui99/dft-agent"
Documentation = "https://github.com/cuiqirui99/dft-agent/blob/main/README.md"
Issues = "https://github.com/cuiqirui99/dft-agent/issues"

[project.scripts]
dft-agent = "vasp_slurm_agent.cli:main"
vasp-agent = "vasp_slurm_agent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vasp_slurm_agent = ["examples/*.cif", "examples/*.vasp", "examples/*.json", "knowledge/**/*", "knowledge/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
